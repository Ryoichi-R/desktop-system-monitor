name: Bug report
description: Report a reproducible Desktop System Monitor problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Redact logs and screenshots before attaching them.
  - type: input
    id: version
    attributes: { label: Version, placeholder: "0.1.0" }
    validations: { required: true }
  - type: dropdown
    id: architecture
    attributes: { label: Architecture, options: [x64, ARM64] }
    validations: { required: true }
  - type: input
    id: os
    attributes: { label: Windows build }
    validations: { required: true }
  - type: textarea
    id: hardware
    attributes: { label: Relevant hardware and display/DPI layout, description: Omit serial numbers and device names. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior, description: Say whether a metric was wrong or correctly showed N/A. }
    validations: { required: true }
  - type: checkboxes
    id: redaction
    attributes:
      label: Privacy check
      options:
        - label: I removed usernames, paths, device/network identifiers, notifications, process names, and secrets.
          required: true
