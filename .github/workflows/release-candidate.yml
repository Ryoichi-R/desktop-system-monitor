name: source-preview-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: project/global.json
      - name: Validate source-only preview contract
        run: pwsh project/scripts/test-publication-contract.ps1
